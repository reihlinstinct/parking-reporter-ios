name: iOS compatibility matrix
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ios-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compat:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 50
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ios: "15.5", experimental: true }
          - { ios: "16.4", experimental: true }
          - { ios: "17.5", experimental: true }
          - { ios: "latest", experimental: false }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Prepare simulator runtime
        run: |
          VER="${{ matrix.ios }}"
          if [ "$VER" != latest ] && ! xcrun simctl list runtimes | grep -q "iOS $VER "; then
            xcodebuild -downloadPlatform iOS -buildVersion "$VER"
          fi
          echo "--- runtimes"; xcrun simctl list runtimes
          xcrun simctl list runtimes -j > /tmp/runtimes.json
          python3 - "$VER" <<'PY' > /tmp/sim.env
          import json, sys
          ver = sys.argv[1]
          rts = [r for r in json.load(open('/tmp/runtimes.json'))['runtimes'] if r['name'].startswith('iOS') and r['isAvailable']]
          if ver != 'latest':
              rts = [r for r in rts if r['version'] == ver]
          if not rts:
              raise SystemExit('no iOS %s runtime available' % ver)
          rt = sorted(rts, key=lambda r: [int(x) for x in r['version'].split('.')])[-1]
          types = [t for t in rt['supportedDeviceTypes'] if t['name'].startswith('iPhone')]
          pick = next((t for t in types if t['name'].startswith('iPhone SE (3rd')), types[0])
          print('RT=%s' % rt['identifier']); print('TYPE=%s' % pick['identifier']); print('RTVER=%s' % rt['version'])
          PY
          cat /tmp/sim.env
      - name: Build and test on the simulator
        run: |
          . /tmp/sim.env
          UDID=$(xcrun simctl create compat "$TYPE" "$RT")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          echo "Testing on iOS $RTVER"
          xcodebuild -project ParkingReporter.xcodeproj -scheme ParkingReporter -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build -resultBundlePath build/Compat.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: compat-${{ matrix.ios }}-results
          path: build/Compat.xcresult
          retention-days: 7
