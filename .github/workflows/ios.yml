name: iOS preview
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: python3 scripts/check_repository.py
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test with simulator-only ad-hoc signing
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project ParkingReporter.xcodeproj -scheme ParkingReporter -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test
      - name: Capture 6s-sized Hebrew and English review screens
        run: |
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["identifier"] for x in d["devicetypes"] if x["name"]=="iPhone SE (3rd generation)"))')
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["identifier"] for x in d["runtimes"] if x["name"].startswith("iOS") and x["isAvailable"]))')
          DEVICE=$(xcrun simctl create "SmallScreenReview" "$TYPE" "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/ParkingReporter.app
          mkdir -p build/screens
          for LANG in he en; do
            for STATE in capture confident uncertain sign crosswalk profile; do
              FLAG=""
              if [ "$STATE" = uncertain ]; then FLAG="--preview-uncertain"; fi
              if [ "$STATE" = capture ]; then FLAG="--preview-capture"; fi
              if [ "$STATE" = sign ]; then FLAG="--preview-sign"; fi
              if [ "$STATE" = crosswalk ]; then FLAG="--preview-crosswalk"; fi
              if [ "$STATE" = profile ]; then FLAG="--preview-profile"; fi
              xcrun simctl terminate "$DEVICE" org.sidewalks.ParkingReporter || true
              xcrun simctl launch "$DEVICE" org.sidewalks.ParkingReporter "--preview-$LANG" $FLAG
              sleep 2
              xcrun simctl io "$DEVICE" screenshot "build/screens/$LANG-$STATE.png"
            done
          done
          xcrun simctl shutdown "$DEVICE"
          xcrun simctl delete "$DEVICE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: simulator-tests-and-preview
          path: |
            build/TestResults.xcresult
            build/screens/
          retention-days: 7
  tink-interop:
    if: github.event.repository.private == false && github.head_ref != 'feat/compact-rtl-design'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: brew install bazelisk maven
      - name: Run pinned-source Tink interoperability test
        run: |
          eval "$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); pairs=[(k,x) for k,v in d["devices"].items() for x in v if x["name"].startswith("iPhone")]; k,x=pairs[0]; print("export SIM_DEVICE="+repr(x["name"])); print("export SIM_VERSION="+repr(k.split("iOS-")[-1].replace("-",".")))')"
          bash scripts/interop.sh
